  <rect x="70" y="814" width="26" height="16" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="106" y="827" font-size="12" fill="#334155">Provided, not executed here — JVM/Docker components (HDFS, Hive, Spark, Pig, docker-compose.bigdata.yml)</text>
