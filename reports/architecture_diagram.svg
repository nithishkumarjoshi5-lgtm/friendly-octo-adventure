  <text x="772" y="827" font-size="12" fill="#334155">pipeline output feed (provided components)</text>
  <rect x="1060" y="788" width="26" height="16" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="1096" y="801" font-size="12" fill="#334155">Edge &amp; consumers — tunnel config provided,</text>
  <text x="1096" y="817" font-size="12" fill="#334155">live public serving not part of test matrix</text>

