  <path d="M 470 585 L 490 585 L 490 650 L 508 650" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <text x="489" y="640" font-size="10" fill="#B45309" text-anchor="end">spark-submit</text>
  <line x1="700" y1="650" x2="738" y2="650" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <text x="719" y="642" font-size="10" fill="#B45309" text-anchor="middle">write.parquet</text>

  <!-- Parquet -> Dashboard feed (dashed elbow) -->
  <path d="M 835 600 L 835 425 L 1295 425 L 1295 262" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <text x="1065" y="417" font-size="10.5" fill="#B45309" text-anchor="middle">load processed parquet — Project Overview page (“Load pipeline output”)</text>

